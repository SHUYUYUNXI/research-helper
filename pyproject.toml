[project]
name = "reachkit"
version = "0.2.4"
description = "联网找资料助手：为 AI 提供互联网搜索、平台访问、跨平台研究、字幕转录与来源归档。"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "联网找资料助手 contributors"}]
keywords = [
    "ai-agent", "llm-tools", "agent-infrastructure", "mcp",
    "web-reader", "web-scraper", "search",
    "twitter-scraper", "reddit-scraper", "youtube-transcript",
    "bilibili", "xiaohongshu",
    "ai-search", "cli", "automation",
    "claude-code", "cursor", "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28", "feedparser>=6.0", "python-dotenv>=1.0", "loguru>=0.7",
    "pyyaml>=6.0", "rich>=13.0", "yt-dlp[default]>=2026.07.04",
]

[project.optional-dependencies]
upstream = [
    "requests>=2.28",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "yt-dlp[default]>=2026.07.04",
]

browser = ["playwright>=1.40"]
mcp = ["mcp[cli]>=1.0,<2.0"]
cookies = ["browser-cookie3>=0.19"]
all = ["playwright>=1.40", "mcp[cli]>=1.0,<2.0", "browser-cookie3>=0.19"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[project.scripts]
reachkit = "reachkit.cli:main"
agent-reach = "agent_reach.cli:main"

[project.urls]
Repository = "https://github.com/SHUYUYUNXI/research-helper"
Upstream = "https://github.com/Panniantong/agent-reach"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_reach", "reachkit"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]
